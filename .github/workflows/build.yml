name: Bygg TV-app

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/puzzles.yml'
      - 'tools/fetch_puzzles.py'
      - 'data/puzzles.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Kontrollera Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME" || { echo "Android SDK saknas på servern"; exit 1; }
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Bygg webbappen
        run: |
          npm install --no-audit --no-fund
          node tools/build.mjs 1.1.${{ github.run_number }}
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets
          cp -r www android/app/src/main/assets/www

      - name: Bygg APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Döp om
        run: cp android/app/build/outputs/apk/release/app-release.apk schack-cypher.apk

      - name: Publicera release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Schack Cypher 1.1.${{ github.run_number }}
          body: |
            ${{ github.event.head_commit.message }}

            Appen hittar uppdateringen själv. Första gången: installera med appen Downloader och länken
            https://github.com/${{ github.repository }}/releases/latest/download/schack-cypher.apk
          files: schack-cypher.apk
          make_latest: true
