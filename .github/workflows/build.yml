name: Bygg TV-app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bygg webbappen
        run: |
          python3 tools/make_www.py
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets
          cp -r www android/app/src/main/assets/www

      - name: Bygg APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Döp om
        run: cp android/app/build/outputs/apk/release/app-release.apk schack-cypher.apk

      - name: Publicera release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Schack Cypher 1.0.${{ github.run_number }}
          body: |
            Installera på TV-boxen med appen Downloader och länken
            https://github.com/${{ github.repository }}/releases/latest/download/schack-cypher.apk
          files: schack-cypher.apk
          make_latest: true
