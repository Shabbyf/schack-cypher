name: Uppdatera pusselpaket

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 */3 *'  # var tredje månad

permissions:
  contents: write

jobs:
  puzzles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Hämta och sampla Lichess pusseldatabas
        run: |
          sudo apt-get install -y zstd > /dev/null
          curl -sSfL https://database.lichess.org/lichess_db_puzzle.csv.zst | zstd -dc | python3 tools/fetch_puzzles.py

      - name: Spara i repot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/puzzles.json
          git diff --cached --quiet && exit 0
          git commit -m "Pussel: uppdatera paketet från Lichess"
          git push
