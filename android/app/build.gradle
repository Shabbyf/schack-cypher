plugins {
    id 'com.android.application'
}

def buildNumber = (System.getenv('VERSION_CODE') ?: '1') as int

android {
    namespace 'se.shabbyf.schackcypher'
    compileSdk 34

    defaultConfig {
        applicationId 'se.shabbyf.schackcypher'
        minSdk 24
        targetSdk 34
        versionCode buildNumber
        versionName "1.1.${buildNumber}"
    }

    // Fast nyckel i repot, så att nya versioner kan installeras ovanpå gamla.
    signingConfigs {
        stable {
            storeFile file('../keystore/schack-cypher.jks')
            storePassword 'schackcypher'
            keyAlias 'schackcypher'
            keyPassword 'schackcypher'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.stable
        }
        debug {
            signingConfig signingConfigs.stable
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress += ['wasm']
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
